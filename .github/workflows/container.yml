name: Build ClairS-TO container

on:
  push:
    branches: ["container/verdict-chm13"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ljwharbers/clairs-to
  SIF_IMAGE: ghcr.io/ljwharbers/clairs-to-sif
  VERSION: 0.5.1-verdict-chm13
  # Commit of verdict-chm13 that this branch's source corresponds to.
  CLAIRSTO_SRC_COMMIT: e2987bf

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The base image carries the models, PoN databases and GRCh38 CNA reference files, so it
      # is around 7 GB and the default runner does not have room for it.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verdict-chm13
          platforms: linux/amd64
          push: true
          # Only the commit-suffixed tag. A floating ${VERSION} tag is a trap for a pipeline that
          # caches images by name: the cached SIF keeps serving the old build forever, and a run
          # pinned to it is not reproducible.
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}-${{ env.CLAIRSTO_SRC_COMMIT }}
          build-args: |
            CLAIRSTO_SRC_COMMIT=${{ env.CLAIRSTO_SRC_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          TAG="${IMAGE}:${VERSION}-${CLAIRSTO_SRC_COMMIT}"
          docker run --rm "$TAG" /opt/bin/run_clairs_to --version | tee version.txt
          grep -q 'run_clairs_to 0.5.1' version.txt
          # Nextflow's task monitoring calls `ps`, and Verdict shells out to GNU parallel.
          docker run --rm "$TAG" ps --version
          docker run --rm "$TAG" bash -lc 'parallel --version | head -1'
          # The CHM13 work: --cna_resource_dir must be a documented option, the resolver must
          # import, and the shipped GRCh38 resource set must still resolve to its own files.
          docker run --rm "$TAG" /opt/bin/run_clairs_to --help | grep -q -- '--cna_resource_dir'
          docker run --rm "$TAG" /opt/micromamba/envs/clairs-to/bin/python3 -c "
          import sys; sys.path.insert(0, '/opt/bin')
          from shared.cna_resources import resolve_cna_resources, missing_resource_files, VERDICT_CONTIGS
          r = resolve_cna_resources('/opt/micromamba/envs/clairs-to/bin/clairs-to_cna_data/reference_files')
          assert not r['errors'], r['errors']
          assert r['loci_prefix'].endswith('G1000_loci_hg38_'), r['loci_prefix']
          assert r['rt_file'] and r['rt_file'].endswith('RT_G1000_hg38.txt'), r['rt_file']
          assert not missing_resource_files(r, VERDICT_CONTIGS)
          print('GRCh38 CNA resources resolve:', r['loci_prefix'])
          "

      # Everything above runs as root, which can read the image's files whatever their mode. The
      # consumers do not: nf-core's docker profile starts containers with
      # `-u $(id -u):$(id -g)`, and the reference files ship 0640 owned by the tarball's builder,
      # so Verdict used to fail deep inside alleleCounter with "does not appear to exist". Run the
      # same checks as a foreign uid, and actually open a loci file.
      - name: Smoke test as a non-root user
        run: |
          set -euo pipefail
          TAG="${IMAGE}:${VERSION}-${CLAIRSTO_SRC_COMMIT}"
          REF=/opt/micromamba/envs/clairs-to/bin/clairs-to_cna_data/reference_files
          docker run --rm --user 1001:1001 "$TAG" head -c 1 "$REF/loci_files/G1000_loci_hg38_chr19.txt" >/dev/null
          docker run --rm --user 1001:1001 "$TAG" /opt/micromamba/envs/clairs-to/bin/python3 -c "
          import sys; sys.path.insert(0, '/opt/bin')
          from shared.cna_resources import resolve_cna_resources, missing_resource_files, unreadable_resource_files, VERDICT_CONTIGS
          r = resolve_cna_resources('$REF')
          assert not r['errors'], r['errors']
          assert not missing_resource_files(r, VERDICT_CONTIGS)
          unreadable = unreadable_resource_files(r, VERDICT_CONTIGS)
          assert not unreadable, 'unreadable as uid 1001: %s' % unreadable[:3]
          print('GRCh38 CNA resources readable as uid 1001')
          "

  build-sif:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.4

      - name: Build SIF from the pushed OCI image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apptainer build clairs-to.sif "docker://${IMAGE}:${VERSION}-${CLAIRSTO_SRC_COMMIT}"
          apptainer exec clairs-to.sif /opt/bin/run_clairs_to --version | tee version.txt
          grep -q 'run_clairs_to 0.5.1' version.txt
          apptainer exec clairs-to.sif /opt/bin/src/verdict/allele_counter/bin/alleleCounter --help \
            >/dev/null 2>&1 || true
          test -x clairs-to.sif && ls -lh clairs-to.sif

      - name: Push SIF to GHCR via ORAS
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer remote login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push clairs-to.sif "oras://${SIF_IMAGE}:${VERSION}-${CLAIRSTO_SRC_COMMIT}"
          echo "pushed oras://${SIF_IMAGE}:${VERSION}-${CLAIRSTO_SRC_COMMIT}"
